spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  grpc:
    client:
      channels:
        product-service:
          default-deadline: 1s
          health:
            enabled: true
          service-config:
            methodConfig:
              - name:
                  - service: "ecommerce.product.v1.ProductService"
                retryPolicy:
                  maxAttempts: 3.0
                  initialBackoff: "0.05s"
                  maxBackoff: "0.1s"
                  backoffMultiplier: 2.0
                  retryableStatusCodes:
                    - "UNAVAILABLE"

app:
  internal:
    api-key: integration-test-key
  http:
    clients:
      payment-service:
        connect-timeout: 1s
        read-timeout: 1s
