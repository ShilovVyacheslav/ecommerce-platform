name: ecommerce-platform

x-common-env: &common-env
  EUREKA_URL: ${EUREKA_URL}
  APP_ENVIRONMENT: docker

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
      args:
        SERVER_PORT: ${DISCOVERY_SERVER_PORT:?DISCOVERY_SERVER_PORT is not set}
    environment:
      SERVER_PORT: ${DISCOVERY_SERVER_PORT}
      APP_ENVIRONMENT: docker
    ports:
      - "${DISCOVERY_SERVER_PORT}:${DISCOVERY_SERVER_PORT}"
    mem_limit: 384m
    logging: *default-logging

  postgres-user:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${USER_DB}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${POSTGRES_USER_PORT}:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    logging: *default-logging

  postgres-payment:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${PAYMENT_DB}
      POSTGRES_USER: ${PAYMENT_DB_USER}
      POSTGRES_PASSWORD: ${PAYMENT_DB_PASSWORD}
    ports:
      - "${POSTGRES_PAYMENT_PORT}:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    logging: *default-logging

  postgres-order:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${ORDER_DB}
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "${POSTGRES_ORDER_PORT}:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    logging: *default-logging

  mongo-product:
    image: mongo:4.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PRODUCT_MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${PRODUCT_MONGO_PASSWORD}
    ports:
      - "${PRODUCT_MONGO_PORT}:27017"
    volumes:
      - mongo-product-data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongo --quiet --eval \"db.adminCommand('ping')\" -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin | grep -q 'ok.*1'" ]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *default-logging

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG" ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 128m
    logging: *default-logging

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
      args:
        SERVER_PORT: ${USER_SERVICE_PORT:?USER_SERVICE_PORT is not set}
    environment:
      <<: *common-env
      SERVER_PORT: ${USER_SERVICE_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/${USER_DB}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    depends_on:
      postgres-user:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    mem_limit: 512m
    logging: *default-logging

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
      args:
        SERVER_PORT: ${PAYMENT_SERVICE_PORT:?PAYMENT_SERVICE_PORT is not set}
    environment:
      <<: *common-env
      SERVER_PORT: ${PAYMENT_SERVICE_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/${PAYMENT_DB}
      SPRING_DATASOURCE_USERNAME: ${PAYMENT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD}
      SECURITY_JWT_JWKS_URI: ${SECURITY_JWT_JWKS_URI}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    ports:
      - "${PAYMENT_SERVICE_PORT}:${PAYMENT_SERVICE_PORT}"
    depends_on:
      postgres-payment:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
    mem_limit: 512m
    logging: *default-logging

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
      args:
        SERVER_PORT: ${PRODUCT_SERVICE_PORT:?PRODUCT_SERVICE_PORT is not set}
    environment:
      <<: *common-env
      SERVER_PORT: ${PRODUCT_SERVICE_PORT}
      SPRING_DATA_MONGODB_URI: mongodb://${PRODUCT_MONGO_USER}:${PRODUCT_MONGO_PASSWORD}@mongo-product:27017/product_service?authSource=admin
      SECURITY_JWT_JWKS_URI: ${SECURITY_JWT_JWKS_URI}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      GRPC_SERVER_PORT: ${PRODUCT_SERVICE_GRPC_PORT}
    ports:
      - "${PRODUCT_SERVICE_PORT}:${PRODUCT_SERVICE_PORT}"
      - "${PRODUCT_SERVICE_GRPC_PORT}:${PRODUCT_SERVICE_GRPC_PORT}"
    depends_on:
      mongo-product:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
    mem_limit: 512m
    logging: *default-logging

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
      args:
        SERVER_PORT: ${ORDER_SERVICE_PORT:?ORDER_SERVICE_PORT is not set}
    environment:
      <<: *common-env
      SERVER_PORT: ${ORDER_SERVICE_PORT}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:5432/${ORDER_DB}
      SPRING_DATASOURCE_USERNAME: ${ORDER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD}
      SECURITY_JWT_JWKS_URI: ${SECURITY_JWT_JWKS_URI}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PRODUCT_SERVICE_GRPC_ADDRESS: static://product-service:${PRODUCT_SERVICE_GRPC_PORT}
    ports:
      - "${ORDER_SERVICE_PORT}:${ORDER_SERVICE_PORT}"
    depends_on:
      postgres-order:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
    mem_limit: 512m
    logging: *default-logging

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
      args:
        SERVER_PORT: ${API_GATEWAY_PORT:?API_GATEWAY_PORT is not set}
    environment:
      <<: *common-env
      SERVER_PORT: ${API_GATEWAY_PORT}
      SECURITY_JWT_JWKS_URI: ${SECURITY_JWT_JWKS_URI}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${API_GATEWAY_PORT}:${API_GATEWAY_PORT}"
    depends_on:
      discovery-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    mem_limit: 512m
    logging: *default-logging

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
      args:
        SERVER_PORT: ${NOTIFICATION_SERVICE_PORT:?NOTIFICATION_SERVICE_PORT is not set}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: ${NOTIFICATION_SERVICE_PORT}
      APP_ENVIRONMENT: docker
    ports:
      - "${NOTIFICATION_SERVICE_PORT}:${NOTIFICATION_SERVICE_PORT}"
    depends_on:
      - kafka:
          condition: service_healthy
    mem_limit: 384m
    logging: *default-logging

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    ports:
      - "9092:9092"
    mem_limit: 512m
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.14.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    mem_limit: 256m
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    mem_limit: 256m
    logging: *default-logging

  kafka-logs-topic:
    image: apache/kafka:latest
    profiles: [ "logging" ]
    entrypoint: [ "/opt/kafka/bin/kafka-topics.sh" ]
    command: [ "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists",
               "--topic", "platform-logs", "--partitions", "3", "--replication-factor", "1",
               "--config", "retention.ms=86400000", "--config", "retention.bytes=536870912" ]
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    logging: *default-logging

  vector-agent:
    image: timberio/vector:0.47.0-alpine
    profiles: [ "logging" ]
    command: [ "--config", "/etc/vector/vector.yaml" ]
    environment:
      LOG_ENVIRONMENT: docker
    volumes:
      - ./monitoring/vector/vector-agent.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-agent-data:/var/lib/vector
    depends_on:
      kafka-logs-topic:
        condition: service_completed_successfully
    mem_limit: 256m
    logging: *default-logging

  vector-aggregator:
    image: timberio/vector:0.47.0-alpine
    profiles: [ "logging" ]
    command: [ "--config", "/etc/vector/vector.yaml" ]
    volumes:
      - ./monitoring/vector/vector-aggregator.yaml:/etc/vector/vector.yaml:ro
      - vector-aggregator-data:/var/lib/vector
    depends_on:
      kafka-logs-topic:
        condition: service_completed_successfully
      loki:
        condition: service_started
    mem_limit: 256m
    logging: *default-logging

  loki:
    image: grafana/loki:3.5.1
    profiles: [ "logging" ]
    command: [ "-config.file=/etc/loki/loki.yaml" ]
    volumes:
      - ./monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    mem_limit: 384m
    logging: *default-logging

volumes:
  postgres-user-data:
  postgres-payment-data:
  postgres-order-data:
  mongo-product-data:
  prometheus-data:
  grafana-data:
  loki-data:
  vector-agent-data:
  vector-aggregator-data:
