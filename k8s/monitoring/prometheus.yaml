apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ecommerce
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: spring-boot-services
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ["api-gateway:8080"]
            labels: { service: api-gateway }
          - targets: ["user-service:8081"]
            labels: { service: user-service }
          - targets: ["payment-service:8082"]
            labels: { service: payment-service }
          - targets: ["product-service:8083"]
            labels: { service: product-service }
          - targets: ["order-service:8084"]
            labels: { service: order-service }
          - targets: ["notification-service:8085"]
            labels: { service: notification-service }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ecommerce
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.14.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: data
          emptyDir: {}