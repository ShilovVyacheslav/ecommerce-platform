apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce
spec:
  selector:
    app: product-service
  ports:
    - port: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: ecommerce-platform-product-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
            - name: MONGO_ROOT_USER
              valueFrom: { secretKeyRef: { name: mongo-credentials, key: MONGO_ROOT_USER } }
            - name: MONGO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mongo-credentials, key: MONGO_ROOT_PASSWORD } }
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://$(MONGO_ROOT_USER):$(MONGO_ROOT_PASSWORD)@mongos:27017/product_service?authSource=admin
            - name: SECURITY_JWT_JWKS_URI
              value: http://user-service:8081/.well-known/jwks.json
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: internal-api-credentials, key: INTERNAL_API_KEY } }
          resources:
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "512Mi", cpu: "500m" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 45
            periodSeconds: 15