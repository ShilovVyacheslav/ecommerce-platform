spring:
  main:
    banner-mode: off
  application:
    name: user-service
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  security:
    jwt:
      private-key-location: classpath:keys/test-private.pem
      public-key-location: classpath:keys/test-public.pem
      access-expiration: 600
      refresh-expiration: 86400
