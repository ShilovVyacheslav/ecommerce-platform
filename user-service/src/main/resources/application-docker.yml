spring:
  datasource:
    url: jdbc:postgresql://postgres-user:5432/user_service
    username: postgres
    password: postgres
  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
  security:
    jwt:
      private-key-location: classpath:keys/docker-private.pem
      public-key-location: classpath:keys/docker-public.pem
      access-expiration: 600
      refresh-expiration: 86400

server:
  port: 8081