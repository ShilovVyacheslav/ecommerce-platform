global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: spring-boot-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ "api-gateway:8080" ]
        labels: { service: api-gateway }
      - targets: [ "user-service:8081" ]
        labels: { service: user-service }
      - targets: [ "payment-service:8082" ]
        labels: { service: payment-service }
      - targets: [ "product-service:8083" ]
        labels: { service: product-service }
      - targets: [ "order-service:8084" ]
        labels: { service: order-service }
      - targets: [ "notification-service:8085" ]
        labels: { service: notification-service }