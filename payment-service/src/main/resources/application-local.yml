spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce-platform?currentSchema=payment_service
    username: postgres
    password: postgres
  flyway:
    url: ${spring.datasource.url}
    user: ${spring.datasource.username}
    password: ${spring.datasource.password}
    schemas: payment_service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  internal:
    api-key: local-internal-api-key