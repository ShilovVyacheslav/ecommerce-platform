spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/product_service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  internal:
    api-key: local-internal-api-key