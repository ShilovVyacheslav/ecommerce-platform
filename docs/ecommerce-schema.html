<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ecommerce-platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #05080C
        }

        html, body, #map, #map * {
            -webkit-user-select: none;
            -moz-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent
        }

        #map {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
            touch-action: none
        }

        #map.drag {
            cursor: grabbing
        }

        #map text {
            text-shadow: 0 0 7px rgba(110, 190, 225, .16)
        }

        .edge, .gnode {
            transition: opacity .16s ease
        }

        svg.iso .gnode:not(.on) {
            opacity: .08
        }

        svg.iso .edge:not(.on) {
            opacity: .04
        }

        .gnode.sel .bk {
            stroke: #FF3B47 !important;
            stroke-width: 2.4
        }

        #fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, .22) 2px 4px),
            radial-gradient(120% 90% at 50% 45%, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, .7) 100%);
            mix-blend-mode: multiply
        }

        #sweep {
            position: fixed;
            left: 0;
            right: 0;
            height: 180px;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(90, 190, 220, 0), rgba(90, 190, 220, .045) 50%, rgba(90, 190, 220, 0));
            animation: sw 11s linear infinite
        }

        @keyframes sw {
            from {
                top: -200px
            }
            to {
                top: 100%
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #sweep {
                display: none
            }

            .edge, .gnode {
                transition: none
            }
        }
    </style>
</head>

    const C = {

    const ADV = 0.6;
    function wpx(s, z) {
        return s.length * z * ADV;
    }

    function fit(s, mw, z) {
        const n = Math.floor(mw / (z * ADV));
        return s.length > n ? s.slice(0, Math.max(0, n - 1)) + '\u2026' : s;
    }

    function E(n, a) {
        const x = document.createElementNS(NS, n);
        for (const k in a) if (a[k] != null) x.setAttribute(k, a[k]);
        return x;
    }

    function T(x, y, s, o) {
        o = o || {};
        const z = o.s || 10.5, out = o.mw ? fit(s, o.mw, z) : s;
        const t = E('text', {
            x,
            y,
            'font-family': 'IBM Plex Mono, monospace',
            'font-size': z,
            'font-weight': o.w || 400,
            fill: o.f || C.dim,
            'text-anchor': o.a || 'start',
            'letter-spacing': o.ls || 0,
            'data-mw': o.mw || null,
            'data-cut': out !== s ? '1' : null

        t.textContent = out;
        return t;

    function bk(g, x, y, w, h, col, L, cls) {

            p: [[[2130, 1342], [2240, 1342]]],
            lp: [2185, 1342],
            l: 'PromQL :9090'
        }
    ];
    const SCRAPE = ['api-gateway', 'user-service', 'product-service', 'order-service', 'payment-service', 'notification-service'];
    const CLS = {route: C.steel, sync: C.white, grpc: C.lav, auth: C.red, data: C.cyan, async: C.amber, obs: C.green};

    const svg = document.getElementById('map');
    const defs = E('defs');
    const gp = E('pattern', {id: 'grid', width: 40, height: 40, patternUnits: 'userSpaceOnUse'});
    gp.appendChild(E('path', {
        d: 'M 40 0 L 0 0 0 40',
        fill: 'none',
        stroke: 'rgba(140,170,195,.055)',
        'stroke-width': 1
    }));
    defs.appendChild(gp);
    Object.keys(CLS).concat(['sel']).forEach(k => {
        const m = E('marker', {
            id: 'ar-' + k,
            viewBox: '0 0 10 10',
            refX: 9,
            refY: 5,
            markerWidth: k === 'sel' ? 5 : 6.5,
            markerHeight: k === 'sel' ? 5 : 6.5,
            orient: 'auto-start-reverse'
        });
        m.appendChild(E('path', {d: 'M0,0 L10,5 L0,10 z', fill: k === 'sel' ? C.faint : CLS[k]}));
        defs.appendChild(m);
    });
    svg.appendChild(defs);
    svg.appendChild(E('rect', {x: -60, y: -60, width: 3030, height: 1650, fill: C.bg}));
    svg.appendChild(E('rect', {x: -60, y: -60, width: 3030, height: 1650, fill: 'url(#grid)'}));

    const gF = E('g');
    gF.appendChild(E('rect', {
        x: -40,
        y: -40,
        width: 2990,
        height: 1610,
        fill: 'none',
        stroke: C.hair,
        'stroke-width': 1.2
    }));
    bk(gF, -40, -40, 2990, 1610, C.red, 46);
    for (let x = 0; x <= 2900; x += 80) {
        gF.appendChild(E('path', {
            d: 'M ' + x + ' -40 L ' + x + ' ' + (x % 400 === 0 ? -26 : -33),
            stroke: C.hair,
            'stroke-width': 1
        }));
        gF.appendChild(E('path', {
            d: 'M ' + x + ' 1570 L ' + x + ' ' + (x % 400 === 0 ? 1556 : 1563),
            stroke: C.hair,
            'stroke-width': 1
        }));
    }
    for (let y = 0; y <= 1520; y += 80) {
        gF.appendChild(E('path', {
            d: 'M -40 ' + y + ' L ' + (y % 400 === 0 ? -26 : -33) + ' ' + y,
            stroke: C.hair,
            'stroke-width': 1
        }));
        gF.appendChild(E('path', {
            d: 'M 2950 ' + y + ' L ' + (y % 400 === 0 ? 2936 : 2943) + ' ' + y,
            stroke: C.hair,
            'stroke-width': 1
        }));
    }
    svg.appendChild(gF);

    const gG = E('g'), gE = E('g'), gN = E('g');
    svg.appendChild(gG);
    svg.appendChild(gE);
    svg.appendChild(gN);

    GROUPS.forEach(g => {
        gG.appendChild(E('rect', {
            x: g.x,
            y: g.y,
            width: g.w,
            height: g.h,
            fill: 'rgba(255,255,255,.012)',
            stroke: g.c,
            'stroke-width': 1.1,
            'stroke-dasharray': '10 7',
            opacity: .62
        }));
        bk(gG, g.x, g.y, g.w, g.h, g.c, 24);
        gG.appendChild(T(g.x + 18, g.y + 24, g.l, {s: 13, w: 600, f: g.c, ls: .5, mw: g.w - 36}));
        gG.appendChild(T(g.x + 18, g.y + 41, g.s, {s: 10, f: C.faint, ls: .3, mw: g.w - 36}));
    });
    gG.appendChild(T(A, 26, 'Outside the cluster', {s: 12, w: 600, f: C.faint, ls: .5}));

    (function () {
        const cw = 313, chh = 40, x0 = A + 14, y0 = R5 + 54;
        CONF.forEach((s, i) => {
            const x = x0 + (i % 4) * (cw + 12), y = y0 + ((i / 4) | 0) * (chh + 6);
            gG.appendChild(E('rect', {
                x,
                y,
                width: cw,
                height: chh,
                fill: s[3] === C.red ? 'rgba(255,59,71,.05)' : 'rgba(91,209,139,.05)',
                stroke: s[3],
                'stroke-width': .8,
                opacity: .9
            }));
            bk(gG, x, y, cw, chh, s[3], 7);
            gG.appendChild(T(x + 10, y + 16, s[0], {s: 8.5, w: 600, f: s[3], ls: .5}));
            gG.appendChild(T(x + 10 + wpx(s[0], 8.5) + 10, y + 16, s[1], {
                s: 10.5,
                w: 600,
                f: C.text,
                mw: cw - 30 - wpx(s[0], 8.5)
            }));
            gG.appendChild(T(x + 10, y + 32, s[2], {s: 8.5, f: C.faint, mw: cw - 20}));
        });
    })();

    NODES.forEach(n => {
        const col = ACC[n.acc], wash = WASH[n.acc];
        const g = E('g', {class: 'gnode', 'data-id': n.id});
        if (n.plain) {
            g.appendChild(E('rect', {
                x: n.x,
                y: n.y,
                width: n.w,
                height: n.h,
                fill: C.plate,
                stroke: col,
                'stroke-width': 1.2,
                opacity: .96
            }));
            bk(g, n.x, n.y, n.w, n.h, col, 13, 'bk');
            g.appendChild(T(n.x + 16, n.y + 28, n.title, {s: 13, w: 600, f: col, ls: .4, mw: n.w - 32}));
            g.appendChild(E('path', {
                d: 'M ' + (n.x + 16) + ' ' + (n.y + 37) + ' H ' + (n.x + n.w - 16),
                stroke: col,
                'stroke-width': .7,
                opacity: .45
            }));
            n.lines.forEach((l, i) => g.appendChild(T(n.x + 16, n.y + 57 + i * 18, l, {
                s: 10.5,
                f: C.dim,
                mw: n.w - 32
            })));
            gN.appendChild(g);
            return;
        }
        const X = n.x, Y = n.y, BX = X + PW + GX;
        const plates = n.svcs.length === 2 ? [Y, Y + CH - PH] : [Y + 44];
        plates.forEach((py, i) => {
            const s = n.svcs[i];
            if (!s) {
                g.appendChild(E('rect', {
                    x: X,
                    y: py,
                    width: PW,
                    height: PH,
                    fill: 'rgba(255,255,255,.01)',
                    stroke: C.faint,
                    'stroke-width': 1.1,
                    'stroke-dasharray': '6 4'
                }));
                bk(g, X, py, PW, PH, C.faint, 9, 'bk');
                g.appendChild(T(X + 12, py + 16, 'no Service', {s: 9, w: 600, f: C.faint, ls: .5}));
                g.appendChild(T(X + 12, py + 34, 'nothing selects', {s: 11.5, w: 600, f: C.faint, mw: PW - 24}));
                g.appendChild(T(X + 12, py + 50, 'these pods', {s: 9.5, f: C.faint, mw: PW - 24}));
                g.appendChild(T(X + 12, py + 66, 'scrape :8085 unresolvable', {s: 8.5, f: C.red, mw: PW - 24}));
                return;
            }
            g.appendChild(E('rect', {
                x: X,
                y: py,
                width: PW,
                height: PH,
                fill: wash,
                stroke: col,
                'stroke-width': 1.3
            }));
            bk(g, X, py, PW, PH, col, 9, 'bk');
            g.appendChild(E('rect', {x: X + 12, y: py + 9, width: 5, height: 8, fill: col}));
            g.appendChild(T(X + 23, py + 17, 'Service', {s: 9, w: 600, f: col, ls: .6}));
            if (s.m) g.appendChild(T(X + PW - 12, py + 17, '\u25c9 metrics', {s: 8, f: C.green, a: 'end'}));
            g.appendChild(T(X + 12, py + 35, s.n, {s: 12, w: 600, f: col, mw: PW - 24}));
            g.appendChild(T(X + 12, py + 51, s.k, {s: 9.5, f: C.dim, mw: PW - 24}));
            g.appendChild(T(X + 12, py + 66, 'selector ' + s.sel, {s: 8.5, f: C.faint, mw: PW - 24}));
            const cy = py + PH / 2;
            g.appendChild(E('path', {
                d: 'M ' + (X + PW + 3) + ' ' + cy + ' L ' + (BX - 3) + ' ' + cy,
                stroke: C.faint,
                'stroke-width': 1,
                'stroke-dasharray': '3 3',
                'marker-end': 'url(#ar-sel)'
            }));
        });
        g.appendChild(E('rect', {
            x: BX,
            y: Y,
            width: BW,
            height: CH,
            fill: C.block,
            stroke: col,
            'stroke-width': 1.3,
            opacity: .97
        }));
        bk(g, BX, Y, BW, CH, col, 11, 'bk');
        g.appendChild(T(BX + BW - 12, Y + 20, 'replicas: 1', {s: 10.5, f: C.dim, a: 'end'}));
        g.appendChild(T(BX + 12, Y + 20, n.ctrl[0] + '/' + n.ctrl[1], {
            s: 11.5,
            w: 600,
            f: col,
            ls: .3,
            mw: BW - 24 - 14 - wpx('replicas: 1', 10.5)
        }));
        g.appendChild(T(BX + 12, Y + 35, n.ctrl[0] === 'StatefulSet' ? SS : RS, {s: 9, f: C.faint, mw: BW - 24}));
        const p = {x: BX + 10, y: Y + 43, w: BW - 20, h: 112};
        g.appendChild(E('rect', {
            x: p.x,
            y: p.y,
            width: p.w,
            height: p.h,
            fill: C.pod,
            stroke: C.hair,
            'stroke-width': 1
        }));
        bk(g, p.x, p.y, p.w, p.h, C.hair, 8);
        const podline = n.ctrl[0] === 'StatefulSet' ? 'Pod  ' + n.pod + '  \u00b7  app=' + n.pod.replace(/-0$/, '') : 'Pod  ' + n.pod;
        g.appendChild(T(p.x + 10, p.y + 17, podline, {s: 10.5, w: 600, f: C.text, ls: .2, mw: p.w - 20}));
        const k = {x: p.x + 9, y: p.y + 24, w: p.w - 18, h: 52};
        g.appendChild(E('rect', {
            x: k.x,
            y: k.y,
            width: k.w,
            height: k.h,
            fill: wash,
            stroke: col,
            'stroke-width': .9
        }));
        g.appendChild(T(k.x + 10, k.y + 16, 'Container ' + n.cont[0], {s: 10.5, w: 600, f: col, ls: .2, mw: k.w - 20}));
        g.appendChild(T(k.x + 10, k.y + 31, n.cont[1], {s: 9.5, f: C.dim, mw: k.w - 20}));
        g.appendChild(T(k.x + 10, k.y + 45, n.cont[2], {s: 9.5, f: C.dim, mw: k.w - 20}));
        n.extra.forEach((e, i) => g.appendChild(T(p.x + 10, k.y + k.h + 14 + i * 14, e, {
            s: 9.5,
            f: C.faint,
            mw: p.w - 20
        })));
        gN.appendChild(g);
    });

    EDGES.forEach(e => {
        const col = CLS[e.c];
        const g = E('g', {class: 'edge', 'data-f': e.f.join(' '), 'data-t': e.t});
        e.p.forEach((pts, i) => {
            const d = 'M ' + pts.map(q => q[0] + ' ' + q[1]).join(' L ');
            const head = !e.bus || i === 0;
            g.appendChild(E('path', {
                d,
                fill: 'none',
                stroke: col,
                'stroke-width': 5,
                opacity: .09,
                'stroke-linejoin': 'round'
            }));
            g.appendChild(E('path', {
                d,
                fill: 'none',
                stroke: col,
                'stroke-width': 1.5,
                'stroke-linejoin': 'round',
                'stroke-dasharray': e.dash ? '7 5' : null,
                'marker-end': head ? 'url(#ar-' + e.c + ')' : null,
                opacity: .95
            }));
        });
        (e.j || []).forEach(q => g.appendChild(E('circle', {cx: q[0], cy: q[1], r: 3.2, fill: col})));
        const w = wpx(e.l, 9.6) + 16;
        g.appendChild(E('rect', {
            class: 'lbl',
            x: e.lp[0] - w / 2,
            y: e.lp[1] - 10,
            width: w,
            height: 20,
            fill: C.bg,
            stroke: col,
            'stroke-width': .7,
            opacity: .95
        }));
        g.appendChild(T(e.lp[0], e.lp[1] + 4, e.l, {s: 9.6, f: col, a: 'middle'}));
        gE.appendChild(g);
    });

    gN.addEventListener('mouseover', ev => {
        const g = ev.target.closest('.gnode');
        if (g) iso(g.dataset.id);
    });
    gN.addEventListener('mouseout', ev => {
        if (ev.target.closest('.gnode')) iso(null);
    });

    function iso(id) {
        if (!id) {
            svg.classList.remove('iso');
            gN.querySelectorAll('.gnode').forEach(n => n.classList.remove('on', 'sel'));
            gE.querySelectorAll('.edge').forEach(n => n.classList.remove('on'));
            return;
        }
        const s = new Set([id]);
        EDGES.forEach(e => {
            if (e.f.includes(id)) s.add(e.t);
            if (e.t === id) e.f.forEach(x => s.add(x));
        });
        if (id === 'prometheus') SCRAPE.forEach(x => s.add(x));
        if (SCRAPE.includes(id)) s.add('prometheus');
        svg.classList.add('iso');
        gN.querySelectorAll('.gnode').forEach(n => {
            n.classList.toggle('on', s.has(n.dataset.id));
            n.classList.toggle('sel', n.dataset.id === id);
        });
        gE.querySelectorAll('.edge').forEach(n => n.classList.toggle('on', n.dataset.f.split(' ').includes(id) || n.dataset.t === id));
    }

    const BASE = {x: -60, y: -60, w: 3030, h: 1650};
    let v = Object.assign({}, BASE);

    function setV() {
        svg.setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);
    }

    function toUser(cx, cy) {
        const r = svg.getBoundingClientRect(), sc = Math.min(r.width / v.w, r.height / v.h);
        return {
            x: v.x + (cx - r.left - (r.width - v.w * sc) / 2) / sc,
            y: v.y + (cy - r.top - (r.height - v.h * sc) / 2) / sc
        };
    }

    svg.addEventListener('wheel', e => {
        e.preventDefault();
        const p = toUser(e.clientX, e.clientY), f = e.deltaY > 0 ? 1.12 : 1 / 1.12;
        const nw = Math.max(BASE.w / 10, Math.min(BASE.w * 1.6, v.w * f)), k = nw / v.w;
        v = {x: p.x - (p.x - v.x) * k, y: p.y - (p.y - v.y) * k, w: nw, h: v.h * k};
        setV();
    }, {passive: false});
    let drag = null;
    svg.addEventListener('pointerdown', e => {
        e.preventDefault();
        drag = {x: e.clientX, y: e.clientY, vx: v.x, vy: v.y};
        svg.classList.add('drag');
        svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', e => {
        if (!drag) return;
        const r = svg.getBoundingClientRect(), sc = Math.min(r.width / v.w, r.height / v.h);
        v.x = drag.vx - (e.clientX - drag.x) / sc;
        v.y = drag.vy - (e.clientY - drag.y) / sc;
        setV();
    });
    ['pointerup', 'pointercancel'].forEach(t => svg.addEventListener(t, () => {
        drag = null;
        svg.classList.remove('drag');
    }));
    svg.addEventListener('dblclick', e => {
        e.preventDefault();
        v = Object.assign({}, BASE);
        setV();
    });
    svg.addEventListener('selectstart', e => e.preventDefault());
</script>
</body>
</html>
