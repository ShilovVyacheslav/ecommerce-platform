    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #05080C
        }

        html, body, #map, #map * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent
        }

        #map {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: grab;
            touch-action: none
        }

        #map.drag {
            cursor: grabbing
        }

        #map text {
            text-shadow: 0 0 7px rgba(110, 190, 225, .16)
        }

        .edge, .gnode {
            transition: opacity .16s ease
        }

        svg.iso .gnode:not(.on) {
            opacity: .08
        }

        svg.iso .edge:not(.on) {
            opacity: .04
        }

        .gnode .bk {
            fill: none;
            stroke-width: 1.5
        }

        .gnode.sel .bk {
            stroke: #FF3B47 !important;
            stroke-width: 2.4
        }

        #fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0) 0 2px, rgba(0, 0, 0, .22) 2px 4px),
            radial-gradient(120% 90% at 50% 42%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, .72) 100%);
            mix-blend-mode: multiply
        }

        #sweep {
            position: fixed;
            left: 0;
            right: 0;
            height: 180px;
            pointer-events: none;
            background: linear-gradient(180deg, rgba(90, 190, 220, 0) 0%, rgba(90, 190, 220, .045) 50%, rgba(90, 190, 220, 0) 100%);
            animation: sw 11s linear infinite
        }

        @keyframes sw {
            from {
                top: -200px
            }
            to {
                top: 100%
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #sweep {
                display: none
            }

            .edge, .gnode {
                transition: none
            }
        }
    </style>
</head>

    ms.appendChild(E('path', {d: 'M0,0 L10,5 L0,10 z', fill: C.faint}));
    defs.appendChild(ms);
    svg.appendChild(defs);

    svg.appendChild(E('rect', {x: -60, y: -60, width: 2560, height: 1910, fill: C.bg}));
    svg.appendChild(E('rect', {x: -60, y: -60, width: 2560, height: 1910, fill: 'url(#grid)'}));

    const gF = E('g');
    gF.appendChild(E('rect', {
        x: -40,
        y: -40,
        width: 2520,
        height: 1870,
        fill: 'none',
        stroke: C.hair,
        'stroke-width': 1.2
    }));
    bk(gF, -40, -40, 2520, 1870, C.red, 46);
    for (let x = 0; x <= 2440; x += 80) {
        gF.appendChild(E('path', {
            d: 'M ' + x + ' -40 L ' + x + ' ' + (x % 400 === 0 ? -26 : -33),
            stroke: C.hair,
            'stroke-width': 1
        }));
        gF.appendChild(E('path', {
            d: 'M ' + x + ' 1830 L ' + x + ' ' + (x % 400 === 0 ? 1816 : 1823),
            stroke: C.hair,
            'stroke-width': 1
        }));
    }
    for (let y = 0; y <= 1790; y += 80) {
        gF.appendChild(E('path', {
            d: 'M -40 ' + y + ' L ' + (y % 400 === 0 ? -26 : -33) + ' ' + y,
            stroke: C.hair,
            'stroke-width': 1
        }));
        gF.appendChild(E('path', {
            d: 'M 2480 ' + y + ' L ' + (y % 400 === 0 ? 2466 : 2473) + ' ' + y,
            stroke: C.hair,
            'stroke-width': 1
        }));
    }
    svg.appendChild(gF);

    const gG = E('g'), gE = E('g'), gN = E('g');
    svg.appendChild(gG);
    svg.appendChild(gE);
    svg.appendChild(gN);

    GROUPS.forEach(g => {
        gG.appendChild(E('rect', {
            x: g.x, y: g.y, width: g.w, height: g.h, fill: 'rgba(255,255,255,.012)',
            stroke: g.c, 'stroke-width': 1.1, 'stroke-dasharray': '10 7', opacity: .62
        }));
        bk(gG, g.x, g.y, g.w, g.h, g.c, 26);
        gG.appendChild(T(g.x + 18, g.y + 27, g.l, {s: 13, w: 600, f: g.c, ls: .6, mw: g.w - 36}));
        gG.appendChild(T(g.x + 18, g.y + 45, g.s, {s: 10, f: C.faint, ls: .4, mw: g.w - 36}));
    });
    gG.appendChild(T(60, 24, 'Outside the cluster', {s: 12, w: 600, f: C.faint, ls: .6}));

    SECRETS.forEach((s, i) => {
        const x = 1257 + (i % 4) * 275, y = 1520 + ((i / 4) | 0) * 80, w = 260;
        gG.appendChild(E('rect', {
            x,
            y,
            width: w,
            height: 72,
            fill: 'rgba(255,59,71,.05)',
            stroke: 'rgba(255,59,71,.5)',
            'stroke-width': 1
        }));
        bk(gG, x, y, w, 72, C.red, 10);
        gG.appendChild(T(x + 12, y + 20, 'Secret', {s: 9, w: 600, f: C.red, ls: .8, mw: w - 24}));
        gG.appendChild(T(x + 12, y + 39, s[0], {s: 11, w: 600, f: C.text, mw: w - 24}));
        gG.appendChild(T(x + 12, y + 58, s[1], {s: 9, f: C.faint, mw: w - 24}));
    });

    NODES.forEach(n => {
        const col = ACC[n.accent], wash = WASH[n.accent];
        const g = E('g', {class: 'gnode', 'data-id': n.id});

        if (n.type === 'plain') {
            g.appendChild(E('rect', {
                x: n.x,
                y: n.y,
                width: n.w,
                height: n.h,
                fill: C.plate,
                stroke: col,
                'stroke-width': 1.2,
                opacity: .96
            }));
            bk(g, n.x, n.y, n.w, n.h, col, 14, 'bk');
            g.appendChild(T(n.x + 16, n.y + 29, n.title, {s: 13, w: 600, f: col, ls: .5, mw: n.w - 32}));
            g.appendChild(E('path', {
                d: 'M ' + (n.x + 16) + ' ' + (n.y + 38) + ' H ' + (n.x + n.w - 16),
                stroke: col,
                'stroke-width': .7,
                opacity: .45
            }));
            n.lines.forEach((l, i) => g.appendChild(T(n.x + 16, n.y + 58 + i * 18, l, {
                s: 10.5,
                f: C.dim,
                mw: n.w - 32
            })));
            gN.appendChild(g);
            return;
        }

        const SH = 42, GAP = 16;

        g.appendChild(E('rect', {
            x: n.x, y: n.y, width: n.w, height: SH, fill: wash, stroke: n.svc ? col : C.faint,
            'stroke-width': 1.3, 'stroke-dasharray': n.svc ? null : '6 4', opacity: .97
        }));
        bk(g, n.x, n.y, n.w, SH, n.svc ? col : C.faint, 11, 'bk');
        if (n.svc) {
            g.appendChild(E('rect', {x: n.x + 12, y: n.y + 10, width: 5, height: 8, fill: col}));
            const right = '  ' + n.svc.k + ' :' + n.svc.p;
            g.appendChild(T(n.x + n.w - 12, n.y + 18, right.trim(), {s: 10, f: C.dim, a: 'end', ls: .3}));
            g.appendChild(T(n.x + 24, n.y + 18, 'Service/' + n.svc.n, {
                s: 12.5,
                w: 600,
                f: col,
                ls: .3,
                mw: n.w - 36 - 12 - wpx(right, 10)
            }));
            g.appendChild(T(n.x + 12, n.y + 34, 'selector: ' + n.sel, {s: 9.5, f: C.faint, mw: n.w - 24}));
        } else {
            g.appendChild(E('rect', {x: n.x + 12, y: n.y + 10, width: 5, height: 8, fill: 'none', stroke: C.faint}));
            g.appendChild(T(n.x + 24, n.y + 18, 'No Service', {s: 12.5, w: 600, f: C.faint, ls: .3}));
            g.appendChild(T(n.x + n.w - 12, n.y + 18, 'nothing selects these pods', {
                s: 10,
                f: C.faint,
                a: 'end',
                ls: .3
            }));
            g.appendChild(T(n.x + 12, n.y + 34, 'consumer only \u2014 connects outbound to kafka:9092', {
                s: 9.5,
                f: C.faint,
                mw: n.w - 24
            }));
        }

        if (n.svc) {
            const mx = n.x + n.w / 2;
            g.appendChild(E('path', {
                d: 'M ' + mx + ' ' + (n.y + SH + 2) + ' L ' + mx + ' ' + (n.y + SH + GAP - 3),
                stroke: C.faint, 'stroke-width': 1, 'stroke-dasharray': '3 3', 'marker-end': 'url(#ar-sel)'
            }));
            g.appendChild(T(mx + 12, n.y + SH + 13, 'label match', {s: 8, f: C.faint, ls: .3}));
        }

        const d = {x: n.x, y: n.y + SH + GAP, w: n.w, h: n.h - SH - GAP};
        g.appendChild(E('rect', {
            x: d.x,
            y: d.y,
            width: d.w,
            height: d.h,
            fill: C.block,
            stroke: col,
            'stroke-width': 1.3,
            opacity: .97
        }));
        bk(g, d.x, d.y, d.w, d.h, col, 11, 'bk');
        const rep = 'replicas: ' + n.ctrl.r;
        g.appendChild(T(d.x + d.w - 12, d.y + 20, rep, {s: 10.5, f: C.dim, a: 'end', ls: .3}));
        g.appendChild(T(d.x + 12, d.y + 20, n.ctrl.k + '/' + n.ctrl.n, {
            s: 11.5,
            w: 600,
            f: col,
            ls: .3,
            mw: d.w - 24 - 14 - wpx(rep, 10.5)
        }));
        g.appendChild(T(d.x + 12, d.y + 35, n.ctrl.k === 'Deployment' ? '\u2514 ReplicaSet' : '\u2514 stable pod name \u00b7 own PersistentVolumeClaim',
            {s: 9, f: C.faint, mw: d.w - 24}));

        const p = {x: d.x + 10, y: d.y + 43, w: d.w - 20, h: d.h - 53};
        g.appendChild(E('rect', {
            x: p.x,
            y: p.y,
            width: p.w,
            height: p.h,
            fill: C.pod,
            stroke: C.hair,
            'stroke-width': 1
        }));
        bk(g, p.x, p.y, p.w, p.h, C.hair, 9);
        const podline = n.ctrl.k === 'Deployment' ? ('Pod  ' + n.pod) : ('Pod  ' + n.pod + '  \u00b7  ' + n.sel);
        g.appendChild(T(p.x + 10, p.y + 17, podline, {s: 10.5, w: 600, f: C.text, ls: .3, mw: p.w - 20}));

        const k = {x: p.x + 9, y: p.y + 24, w: p.w - 18, h: 52};
        g.appendChild(E('rect', {
            x: k.x,
            y: k.y,
            width: k.w,
            height: k.h,
            fill: wash,
            stroke: col,
            'stroke-width': .9
        }));
        g.appendChild(T(k.x + 10, k.y + 16, 'Container ' + n.cont.n, {s: 10.5, w: 600, f: col, ls: .3, mw: k.w - 20}));
        g.appendChild(T(k.x + 10, k.y + 31, n.cont.i + '   :' + n.cont.p, {s: 9.5, f: C.dim, mw: k.w - 20}));
        g.appendChild(T(k.x + 10, k.y + 45, n.cont.r, {s: 9.5, f: C.dim, mw: k.w - 20}));

        n.extra.forEach((e, i) => g.appendChild(T(p.x + 10, k.y + k.h + 14 + i * 14, e, {
            s: 9.5,
            f: C.faint,
            mw: p.w - 20
        })));
        gN.appendChild(g);
    });

    EDGES.forEach(e => {
        const col = CLS[e.c];
        const g = E('g', {class: 'edge', 'data-f': e.f, 'data-t': e.t});
        const d = e.d || ('M ' + e.pts.map(p => p[0] + ' ' + p[1]).join(' L '));
        g.appendChild(E('path', {
            d,
            fill: 'none',
            stroke: col,
            'stroke-width': 5,
            opacity: .09,
            'stroke-linejoin': 'round'
        }));
        g.appendChild(E('path', {
            d, fill: 'none', stroke: col, 'stroke-width': 1.5, 'stroke-linejoin': 'round',
            'stroke-dasharray': e.dash ? '7 5' : null, 'marker-end': 'url(#ar-' + e.c + ')', opacity: .95
        }));
        const w = wpx(e.l, 9.6) + 16;
        g.appendChild(E('rect', {
            x: e.lp[0] - w / 2,
            y: e.lp[1] - 10,
            width: w,
            height: 20,
            fill: C.bg,
            stroke: col,
            'stroke-width': .7,
            opacity: .95
        }));
        g.appendChild(T(e.lp[0], e.lp[1] + 4, e.l, {s: 9.6, f: col, a: 'middle'}));
        gE.appendChild(g);
    });

    gN.addEventListener('mouseover', ev => {
        const g = ev.target.closest('.gnode');
        if (g) iso(g.dataset.id);
    });
    gN.addEventListener('mouseout', ev => {
        if (ev.target.closest('.gnode')) iso(null);
    });

    function iso(id) {
        if (!id) {
            svg.classList.remove('iso');
            gN.querySelectorAll('.gnode').forEach(n => n.classList.remove('on', 'sel'));
            gE.querySelectorAll('.edge').forEach(n => n.classList.remove('on'));
            return;
        }
        const s = new Set([id]);
        EDGES.forEach(e => {
            if (e.f === id) s.add(e.t);
            if (e.t === id) s.add(e.f);
        });
        svg.classList.add('iso');
        gN.querySelectorAll('.gnode').forEach(n => {
            n.classList.toggle('on', s.has(n.dataset.id));
            n.classList.toggle('sel', n.dataset.id === id);
        });
        gE.querySelectorAll('.edge').forEach(n => n.classList.toggle('on', n.dataset.f === id || n.dataset.t === id));
    }

    const BASE = {x: -60, y: -60, w: 2560, h: 1910};
    let v = {x: -60, y: -60, w: 2560, h: 1910};

    function setV() {
        svg.setAttribute('viewBox', v.x + ' ' + v.y + ' ' + v.w + ' ' + v.h);
    }

    function toUser(cx, cy) {
        const r = svg.getBoundingClientRect(), sc = Math.min(r.width / v.w, r.height / v.h);
        const ox = (r.width - v.w * sc) / 2, oy = (r.height - v.h * sc) / 2;
        return {x: v.x + (cx - r.left - ox) / sc, y: v.y + (cy - r.top - oy) / sc};
    }

    svg.addEventListener('wheel', e => {
        e.preventDefault();
        const p = toUser(e.clientX, e.clientY), f = e.deltaY > 0 ? 1.12 : 1 / 1.12;
        const nw = Math.max(BASE.w / 9, Math.min(BASE.w * 1.6, v.w * f)), k = nw / v.w;
        v = {x: p.x - (p.x - v.x) * k, y: p.y - (p.y - v.y) * k, w: nw, h: v.h * k};
        setV();
    }, {passive: false});
    let drag = null;
    svg.addEventListener('pointerdown', e => {
        e.preventDefault();
        drag = {x: e.clientX, y: e.clientY, vx: v.x, vy: v.y};
        svg.classList.add('drag');
        svg.setPointerCapture(e.pointerId);
    });
    svg.addEventListener('pointermove', e => {
        if (!drag) return;
        const r = svg.getBoundingClientRect(), sc = Math.min(r.width / v.w, r.height / v.h);
        v.x = drag.vx - (e.clientX - drag.x) / sc;
        v.y = drag.vy - (e.clientY - drag.y) / sc;
        setV();
    });
    ['pointerup', 'pointercancel'].forEach(t => svg.addEventListener(t, () => {
        drag = null;
        svg.classList.remove('drag');
    }));
    svg.addEventListener('dblclick', e => {
        e.preventDefault();
        v = {x: BASE.x, y: BASE.y, w: BASE.w, h: BASE.h};
        setV();
    });
    svg.addEventListener('selectstart', e => e.preventDefault());
</script>
</body>
</html>
